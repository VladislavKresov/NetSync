name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore NetSync.sln
      - name: Build (both targets, warnings as errors)
        run: dotnet build NetSync.sln --no-restore -c Release
      - name: Test
        run: dotnet test NetSync.sln --no-build -c Release --logger "console;verbosity=normal"

  pack:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack
        run: dotnet pack src/NetSync/NetSync.csproj -c Release -o artifacts
      - name: Unity package (the release publishes it)
        run: |
          python3 tools/pack-unity.py --dll src/NetSync/bin/Release/netstandard2.1 --version 0.0.0-ci --out "$RUNNER_TEMP/unity"
          npm pack "$RUNNER_TEMP/unity" --dry-run
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.*nupkg
