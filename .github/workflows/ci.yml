name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the running checks of an older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # every system reports its own result
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore NetSync.sln
      - name: Build (both targets, warnings as errors)
        run: dotnet build NetSync.sln --no-restore -c Release
      - name: Test (the net8.0 and netstandard2.1 builds of the core, on .NET 8 and .NET 10)
        shell: bash
        # A test that hangs is stopped after 10 minutes and named in the log (--blame-hang).
        run: |
          set -o pipefail
          dotnet test NetSync.sln --no-build -c Release --logger "console;verbosity=normal" \
            --blame-hang-timeout 10m --blame-hang-dump-type none 2>&1 | tee test-output.txt
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python3 tools/ci-annotate.py test-output.txt
      - name: Show reserved port ranges (Windows reserves ranges for Hyper-V and similar)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($protocol in 'udp', 'tcp') {
            $ranges = (netsh int ipv4 show excludedportrange protocol=$protocol | Select-String '^\s*\d+\s+\d+') -join '; '
            Write-Output "::warning title=Excluded $protocol ports::$ranges"
          }
          $dynamic = (netsh int ipv4 show dynamicport udp | Out-String) -replace '\s+', ' '
          Write-Output "::warning title=Dynamic udp ports::$dynamic"
      - name: Name a hanging test (runs the tests one at a time)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          dotnet test tests/NetSync.Tests/NetSync.Tests.csproj --no-build -c Release -f net8.0 --logger "console;verbosity=normal" \
            --blame-hang-timeout 3m --blame-hang-dump-type none -- xUnit.ParallelizeTestCollections=false 2>&1 | tee sequential-output.txt || true
          python3 tools/ci-annotate.py sequential-output.txt

  native-aot:
    # The library declares itself AOT-compatible: publish a sample as a trimmed native binary and
    # run it — an encrypted connection echoing over TCP and reliable UDP (Echo selftest).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Echo with NativeAOT (trim and AOT warnings are errors)
        run: dotnet publish samples/Echo -c Release -r linux-x64 -p:AotSample=true -p:TreatWarningsAsErrors=true -o aot
      - name: Run the native binary
        run: ./aot/Echo selftest

  pack:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Docs links (every relative link and heading anchor resolves)
        run: python3 tools/mdlinks.py --check
      - name: Pack (fails when the public API breaks compatibility with the baseline release)
        run: dotnet pack src/NetSync/NetSync.csproj -c Release -o artifacts
      - name: Unity package (the release publishes it)
        run: |
          python3 tools/pack-unity.py --dll src/NetSync/bin/Release/netstandard2.1 --version 0.0.0-ci --out "$RUNNER_TEMP/unity"
          npm pack "$RUNNER_TEMP/unity" --dry-run
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.*nupkg
